version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests launch the binaries they just built and read fixed local paths.
      - path: _test\.go
        linters: [gosec]
        text: "G204|G304"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SENEBICLABS/Senebiclabs-Dataset-Studio
